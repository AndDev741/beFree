apiVersion: apps/v1
kind: Deployment
metadata:
  name: befree-backend
  namespace: befree
spec:
  replicas: 1
  selector:
    matchLabels:
      app: befree-backend
  template:
    metadata:
      labels:
        app: befree-backend
    spec:
      containers:
        - name: backend
          image: ghcr.io/anddev741/befree-backend:latest
          ports:
            - containerPort: 8080
          env:
            - name: QUARKUS_DATASOURCE_JDBC_URL
              value: jdbc:postgresql://postgres:5432/befree
            - name: QUARKUS_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef: { name: befree-db, key: user }
            - name: QUARKUS_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef: { name: befree-db, key: password }
          resources:
            requests: { memory: 64Mi, cpu: 100m }
            limits: { memory: 160Mi }
          readinessProbe:
            httpGet: { path: /q/health/ready, port: 8080 }
          livenessProbe:
            httpGet: { path: /q/health/live, port: 8080 }
---
apiVersion: v1
kind: Service
metadata:
  name: befree-backend
  namespace: befree
spec:
  type: NodePort
  selector:
    app: befree-backend
  ports:
    - port: 80
      targetPort: 8080
      nodePort: 30080
