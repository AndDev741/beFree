quarkus.native.march=x86-64-v2

# Random test port so the suite never collides with whatever else runs on this machine
quarkus.http.test-port=0

# Schema is owned by Flyway in every profile, so packaged/native integration
# tests (prod profile) run against the same DDL as dev and real prod
quarkus.flyway.migrate-at-start=true

# WhatsApp Business Cloud API (webhook-driven, replies via Graph API). Secrets via env:
# WHATSAPP_ACCESS_TOKEN, WHATSAPP_PHONE_NUMBER_ID, WHATSAPP_VERIFY_TOKEN,
# WHATSAPP_APP_SECRET, WHATSAPP_ALLOWED_PHONES
quarkus.rest-client.whatsapp-api.url=https://graph.facebook.com/v23.0

# AI assistant: DeepSeek through LangChain4j's OpenAI-compatible client. The real key arrives via
# env QUARKUS_LANGCHAIN4J_OPENAI_API_KEY; the extension requires the property to exist, so "disabled"
# is the sentinel that keeps the assistant off (chat replies with a configuration notice) until a key is provided.
quarkus.langchain4j.openai.base-url=https://api.deepseek.com/v1
quarkus.langchain4j.openai.api-key=disabled
quarkus.langchain4j.openai.chat-model.model-name=deepseek-v4-flash
# DeepSeek V4 thinks by default at "high" effort and its reasoning tokens count inside max-tokens;
# a turn that spends the budget thinking returns empty content. Low effort is plenty for bookkeeping.
quarkus.langchain4j.openai.chat-model.reasoning-effort=low
quarkus.langchain4j.openai.chat-model.max-tokens=8192
# Low temperature: this is bookkeeping with tool calls, not creative writing
quarkus.langchain4j.openai.chat-model.temperature=0.3
quarkus.langchain4j.openai.timeout=90s
# Second, named model for reading images (receipts, screenshots); same key, vision-capable DeepSeek model
quarkus.langchain4j.openai.vision.base-url=https://api.deepseek.com/v1
quarkus.langchain4j.openai.vision.api-key=${quarkus.langchain4j.openai.api-key}
quarkus.langchain4j.openai.vision.chat-model.model-name=deepseek-v4-flash-vision-exp
quarkus.langchain4j.openai.vision.chat-model.reasoning-effort=low
quarkus.langchain4j.openai.vision.chat-model.max-tokens=4096
quarkus.langchain4j.openai.vision.chat-model.temperature=0.1
quarkus.langchain4j.openai.vision.timeout=120s
quarkus.langchain4j.chat-memory.type=message-window
quarkus.langchain4j.chat-memory.memory-window.max-messages=40
# Ack Meta immediately and run the assistant on a virtual thread; tests run inline
whatsapp.async-processing=true
%test.whatsapp.async-processing=false

# Shared timezone for "today" in chat and dates without a year
befree.zone=Europe/Lisbon

# Voice notes: OpenAI-compatible /audio/transcriptions (Groq Whisper by default, free tier; OpenAI whisper-1 works too).
# Off until BEFREE_TRANSCRIPTION_API_KEY is set.
befree.transcription.base-url=https://api.groq.com/openai/v1
befree.transcription.model=whisper-large-v3-turbo
befree.transcription.language=pt

# --- Access control -------------------------------------------------------
# Single user today, but users live in a real table with bcrypt hashes, which is
# both the honest choice for something reachable from the internet and the seam
# for a second user later. Form authentication with empty login/error/landing
# pages makes Quarkus answer 401 instead of redirecting, which is what an SPA needs.
befree.owner=andre
quarkus.http.auth.form.enabled=true
quarkus.http.auth.form.login-page=
quarkus.http.auth.form.error-page=
quarkus.http.auth.form.landing-page=
quarkus.http.auth.form.post-location=/api/login
quarkus.http.auth.form.cookie-name=befree-session
quarkus.http.auth.form.timeout=P14D
quarkus.http.auth.form.new-cookie-interval=PT1H
# Persist the cookie so the phone does not ask for the password on every browser restart
quarkus.http.auth.form.cookie-max-age=P14D
quarkus.http.auth.form.cookie-same-site=lax
# The SPA never reads the cookie, so keep it out of reach of any script
quarkus.http.auth.form.http-only-cookie=true
quarkus.http.auth.session.encryption-key=${BEFREE_SESSION_KEY:a-development-only-key-at-least-sixteen-chars}

# Meta signs its webhook with an HMAC, so it authenticates itself and must stay open.
quarkus.http.auth.permission.webhook.paths=/webhooks/*
quarkus.http.auth.permission.webhook.policy=permit
quarkus.http.auth.permission.health.paths=/q/*
quarkus.http.auth.permission.health.policy=permit
quarkus.http.auth.permission.login.paths=/api/login,/api/session,/api/logout
quarkus.http.auth.permission.login.policy=permit
quarkus.http.auth.permission.api.paths=/api/*
quarkus.http.auth.permission.api.policy=authenticated

# The password hash is created on first start from this value. Dev and test use a
# known password ("befree-dev") so the suite can log in; production supplies its own.
befree.auth.initial-password=${BEFREE_PASSWORD:}
%dev.befree.auth.initial-password=befree-dev
%test.befree.auth.initial-password=befree-dev

# The SPA is served from the same origin in production; this covers `vite dev`.
# Statements and photos come in through the chat, so the default 10M is tight
quarkus.http.limits.max-body-size=25M

quarkus.http.cors=true
quarkus.http.cors.origins=/https?://localhost:[0-9]+/,/https?://beyou-server:[0-9]+/
quarkus.http.cors.methods=GET,POST,PUT,PATCH,DELETE,OPTIONS
quarkus.http.cors.access-control-allow-credentials=true
